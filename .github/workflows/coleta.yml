name: Coleta diária
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 em Belém (09:17 UTC)
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora
  push:
    paths: ["entrada/**"]   # roda sozinho quando o Grokbot entrega a lista da Caixa
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m coletor.main
      - name: Guardar resultado no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "Coleta $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
